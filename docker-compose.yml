# ===========================================================================
# docker-compose.yml – starts every part of the pipeline in containers.
#
#   PPT layer             Service here
#   -------------------   ------------------------------------------
#   1. Wearable devices   generator          (simulated wearables -> Kafka)
#   2. Ingestion          kafka              (Apache Kafka 3.7.1, KRaft mode = no Zookeeper)
#                         kafka-init         (creates the "vitals" topic, then exits)
#                         mosquitto, mqtt-bridge, generator-mqtt   (OPTIONAL MQTT path, profile "mqtt")
#   3. Big Data platform  spark-streaming    (Spark Structured Streaming -> Bronze/Silver/Gold Parquet)
#                         hive-queries       (HiveQL tables + example queries, run on demand)
#                         hive-shell         (interactive HiveQL prompt, run on demand)
#
# More services are added in the later phases.
# ===========================================================================
name: wearable-health

# Settings shared by every service that uses our own Python/Spark image.
x-app: &app
  build: .
  image: wearable-health-app:1.0
  init: true                       # clean Ctrl+C / "docker compose stop"
  volumes:
    - ./:/app                      # your project folder (code + data/ lake)
    - hive_metastore:/hive         # Hive metastore (Derby DB) lives in a Docker volume
  environment:
    KAFKA_BOOTSTRAP: kafka:29092   # Kafka address as seen from inside Docker
    MQTT_HOST: mosquitto

services:

  # -------------------------------------------------------------------------
  # Apache Kafka – the message broker that receives the wearable stream.
  # KRaft mode: Kafka manages itself, so we do NOT need a Zookeeper container
  # (saves ~500 MB of RAM on a laptop).
  # -------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"          # for tools running on your laptop (localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      # Two listeners: one for other containers (kafka:29092), one for your laptop (localhost:9092)
      KAFKA_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      # Single broker => replication factor 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_LOG_RETENTION_HOURS: 24      # keep 1 day of readings (enough for a demo)
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M" # keep Kafka small for an 8 GB laptop
    volumes:
      - kafka_data:/var/lib/kafka/data   # Kafka messages survive "docker compose stop/start"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # -------------------------------------------------------------------------
  # One-shot helper: creates the "vitals" topic with 3 partitions.
  # Messages are keyed by patient_id, so all readings of one patient go to the
  # same partition (the PPT's "per-patient partitions"). Exits when done.
  # -------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.7.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic vitals --partitions 3 --replication-factor 1
        echo "Topics in Kafka now:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic vitals
    restart: "no"

  # -------------------------------------------------------------------------
  # PHASE 3 - Wearable simulator: 20 patients, one reading every 1-2 s each,
  # published as JSON to Kafka topic "vitals".
  # -------------------------------------------------------------------------
  generator:
    <<: *app
    container_name: generator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["python3", "generator/wearable_simulator.py", "--patients", "20", "--mode", "kafka"]

  # -------------------------------------------------------------------------
  # OPTIONAL (profile "mqtt") - the full PPT ingestion path:
  #   simulator --MQTT--> mosquitto --bridge--> Kafka
  # Start with:  docker compose --profile mqtt up -d mosquitto mqtt-bridge generator-mqtt
  # (use this INSTEAD of the normal "generator" service, not both)
  # -------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: mosquitto
    profiles: ["mqtt"]
    ports:
      - "1883:1883"
    volumes:
      - ./ingestion/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  mqtt-bridge:
    <<: *app
    container_name: mqtt-bridge
    profiles: ["mqtt"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    command: ["python3", "ingestion/mqtt_to_kafka_bridge.py"]

  generator-mqtt:
    <<: *app
    container_name: generator-mqtt
    profiles: ["mqtt"]
    depends_on:
      mqtt-bridge:
        condition: service_started
    command: ["python3", "generator/wearable_simulator.py", "--patients", "20", "--mode", "mqtt"]

  # -------------------------------------------------------------------------
  # PHASE 4 - Spark Structured Streaming: Kafka -> Bronze / Silver / Gold.
  # Spark UI (Structured Streaming tab): http://localhost:4040
  # -------------------------------------------------------------------------
  spark-streaming:
    <<: *app
    container_name: spark-streaming
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "4040:4040"
    command: ["spark-submit", "--driver-memory", "1g",
              "--conf", "spark.ui.showConsoleProgress=false",
              "spark/streaming_job.py"]

  # -------------------------------------------------------------------------
  # PHASE 5 - Hive (HiveQL through Spark's built-in Hive support).
  # On-demand tools (profile "tools"):
  #   docker compose run --rm hive-queries     -> create tables + run hive/queries.hql
  #   docker compose run --rm hive-shell       -> interactive "spark-sql>" HiveQL prompt
  # Only run ONE of these at a time (the small Derby metastore allows one user).
  # -------------------------------------------------------------------------
  hive-queries:
    <<: *app
    profiles: ["tools"]
    command: ["spark-submit", "--driver-memory", "1g",
              "--driver-java-options", "-Dderby.system.home=/hive",
              "hive/run_hive_queries.py"]

  hive-shell:
    <<: *app
    profiles: ["tools"]
    stdin_open: true
    tty: true
    command: ["spark-sql", "--driver-memory", "1g",
              "--driver-java-options", "-Dderby.system.home=/hive",
              "--conf", "spark.sql.warehouse.dir=/hive/warehouse",
              "--conf", "spark.hadoop.javax.jdo.option.ConnectionURL=jdbc:derby:;databaseName=/hive/metastore_db;create=true",
              "--conf", "spark.sql.hive.manageFilesourcePartitions=false",
              "--conf", "spark.sql.session.timeZone=UTC",
              "--database", "wearable_health"]

volumes:
  kafka_data:       # Kafka's message log
  hive_metastore:   # Hive metastore database (used from Phase 5)
