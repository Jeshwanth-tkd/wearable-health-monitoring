# ===========================================================================
# docker-compose.yml – starts every part of the pipeline in containers.
#
#   PPT layer             Service here
#   -------------------   ------------------------------------------
#   2. Ingestion          kafka (Apache Kafka 3.7.1, KRaft mode = no Zookeeper)
#                         kafka-init (creates the "vitals" topic, then exits)
#
# More services are added in the later phases.
# ===========================================================================
name: wearable-health

services:

  # -------------------------------------------------------------------------
  # Apache Kafka – the message broker that receives the wearable stream.
  # KRaft mode: Kafka manages itself, so we do NOT need a Zookeeper container
  # (saves ~500 MB of RAM on a laptop).
  # -------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"          # for tools running on your laptop (localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      # Two listeners: one for other containers (kafka:29092), one for your laptop (localhost:9092)
      KAFKA_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      # Single broker => replication factor 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_LOG_RETENTION_HOURS: 24      # keep 1 day of readings (enough for a demo)
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M" # keep Kafka small for an 8 GB laptop
    volumes:
      - kafka_data:/var/lib/kafka/data   # Kafka messages survive "docker compose stop/start"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # -------------------------------------------------------------------------
  # One-shot helper: creates the "vitals" topic with 3 partitions.
  # Messages are keyed by patient_id, so all readings of one patient go to the
  # same partition (the PPT's "per-patient partitions"). Exits when done.
  # -------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.7.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic vitals --partitions 3 --replication-factor 1
        echo "Topics in Kafka now:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic vitals
    restart: "no"

volumes:
  kafka_data:       # Kafka's message log
